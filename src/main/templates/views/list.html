{% extends 'base/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block body %}
<div class="nb-wrap nb-page">
    <header class="nb-pagehead">
        <span class="nb-sticker nb-sticker--green">New listing</span>
        <h1 class="nb-h1">List</h1>
        <p class="nb-pagehead__lead">Add your car’s details, a photo and where it is.</p>
    </header>

    <form action="" method="post" enctype="multipart/form-data" class="nb-form">
        {% csrf_token %}
        <div class="nb-form__grid">
            <section class="nb-panel nb-panel--white">
                <h2 class="nb-h3">The car</h2>
                {{listing_form|crispy}}
            </section>
            <section class="nb-panel nb-panel--pink">
                <h2 class="nb-h3">Where it is</h2>
                {{location_form|crispy}}
            </section>
        </div>
        <div class="nb-form__submit">
            <button class="nb-btn nb-btn--blue nb-btn--lg" type="submit">Save</button>
            <a href="{% url 'home' %}" class="nb-btn nb-btn--white nb-btn--lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
